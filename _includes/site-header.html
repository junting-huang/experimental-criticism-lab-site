<header class="{{ include.class | default: 'page-header about-header' }}">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="Experimental Criticism Lab home">
    <span class="monogram">[ECL]</span>
    <span class="brand-name">Experimental<br>Criticism Lab</span>
  </a>

  <nav class="top-nav" aria-label="Main navigation">
    {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
